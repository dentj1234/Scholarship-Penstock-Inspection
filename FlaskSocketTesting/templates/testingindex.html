<!DOCTYPE html>
<html>
<head>
    <title>Penstock Control</title>
    <script src="{{ url_for('static', filename='socket.io.min.js') }}"></script>
    <script src="{{ url_for('static', filename='testingmain.js', v='telemetry-4') }}" defer></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='testingstyles.css', v='telemetry-4') }}">
</head>
<body>
    <div class="main-container">
        <div class="video-section">
            <div>
                <button onclick="switchCamera('http://192.168.1.2:8889/cam1')">View Node 0 Camera</button>
                <button onclick="switchCamera('http://192.168.1.3:8889/cam1')">View Node 2 Camera</button>
            </div>
            
            <iframe id="camStream" src="http://192.168.1.2:8889/cam1" width="640" height="432"></iframe>
            
            <div class="bottom-controls-row">
                <div class="control-group">
                    <label for="nodeSelect">Target Node:</label>
                    <select id="nodeSelect">
                        <option value="0">Node 0</option>
                        <option value="2">Node 2</option>
                    </select>
                </div>

                <div class="telemetry-box">
                    <strong>Telemetry</strong>
                    <div class="telemetry-node">
                        <strong>Node 0:</strong>
                        <span id="telemetryNode0">Waiting for data...</span>
                    </div>
                    <div class="telemetry-node">
                        <strong>Node 2:</strong>
                        <span id="telemetryNode2">Waiting for data...</span>
                    </div>
                </div>
            </div>
            <p class="control-hint">Press and hold a direction to move. Release to stop.</p>
        </div>

        <div class="dpad-container">
            <button type="button" class="cmd-btn" data-action="forward" id="btnForward">Forward</button>
            <button type="button" class="cmd-btn" data-action="left" id="btnLeft">Left</button>
            <button type="button" class="cmd-btn" data-action="stop" id="btnStop">STOP</button>
            <button type="button" class="cmd-btn" data-action="right" id="btnRight">Right</button>
            <button type="button" class="cmd-btn" data-action="backward" id="btnBackward">Backward</button>
        </div>
    </div>
</body>
</html>
